name: Publish satellite-protocol
on:
  push:
    tags:
      - "satellite-protocol-v*"
  # Publish a prerelease build of the current branch, for testing before tagging a release
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump the prerelease is for, from the version in satellite-protocol/package.json ('as-is' when it has already been bumped)"
        type: choice
        required: true
        default: "patch"
        options:
          - patch
          - minor
          - major
          - as-is
      dist-tag:
        description: "npm dist-tag to publish the prerelease under"
        required: true
        default: "dev"

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.repository_owner == 'bitfocus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: yarn install
        run: |
          npm install -g corepack --force

          # try and avoid timeout errors
          yarn config set httpTimeout 100000

          yarn install --immutable

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_DIST_TAG: ${{ inputs.dist-tag }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: yarn tsx tools/satellite_protocol_release_version.mts

      - name: Test
        run: yarn vitest run --project satellite-protocol

      - name: Check generated assets are up to date
        run: yarn build:satellite-schema --check

      - name: Build
        run: yarn workspace @companion-app/satellite-protocol build

      - name: Pack
        working-directory: satellite-protocol
        run: |
          mkdir -p ../.pack
          npm pack --pack-destination ../.pack

      - uses: actions/upload-artifact@v7
        with:
          name: satellite-protocol-package
          path: .pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance. Kept to this job, which runs no repository code
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          name: satellite-protocol-package
          path: .pack

      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish .pack/*.tgz --provenance --access public --tag "$DIST_TAG"
