name: Publish satellite-protocol
on:
  push:
    tags:
      - "satellite-protocol-v*"
  # Publish a prerelease build of the current branch, for testing before tagging a release
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag to publish the prerelease under"
        required: true
        default: "dev"

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.repository_owner == 'bitfocus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: yarn install
        run: |
          npm install -g corepack --force

          # try and avoid timeout errors
          yarn config set httpTimeout 100000

          yarn install --immutable

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_DIST_TAG: ${{ inputs.dist-tag }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VERSION=$(node -p "require('./satellite-protocol/package.json').version")

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$TAG" != "satellite-protocol-v$VERSION" ]]; then
              echo "Tag $TAG does not match satellite-protocol/package.json version $VERSION"
              exit 1
            fi

            if [[ "$VERSION" == *-* ]]; then
              DIST_TAG=next
            else
              DIST_TAG=latest
            fi
          else
            if [[ ! "$INPUT_DIST_TAG" =~ ^[a-z][a-z0-9-]*$ || "$INPUT_DIST_TAG" == "latest" || "$INPUT_DIST_TAG" == "next" ]]; then
              echo "Invalid dist-tag '$INPUT_DIST_TAG': must be lowercase, and not 'latest' or 'next'"
              exit 1
            fi
            DIST_TAG="$INPUT_DIST_TAG"

            # A unique prerelease version for this run, eg 0.1.0-dev.12.1.gabc1234
            VERSION="${VERSION%%-*}-${DIST_TAG}.${RUN_NUMBER}.${RUN_ATTEMPT}.g${SHA:0:7}"
            node -e "
              const fs = require('node:fs')
              const file = 'satellite-protocol/package.json'
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
              pkg.version = process.argv[1]
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n')
            " "$VERSION"
          fi

          echo "Publishing $VERSION with dist-tag $DIST_TAG"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: yarn vitest run --project satellite-protocol

      - name: Check generated assets are up to date
        run: yarn build:satellite-schema --check

      - name: Build
        run: yarn workspace @companion-app/satellite-protocol build

      - name: Pack
        working-directory: satellite-protocol
        run: |
          mkdir -p ../.pack
          npm pack --pack-destination ../.pack

      - uses: actions/upload-artifact@v7
        with:
          name: satellite-protocol-package
          path: .pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance. Kept to this job, which runs no repository code
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          name: satellite-protocol-package
          path: .pack

      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish .pack/*.tgz --provenance --access public --tag "$DIST_TAG"
